<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jardín de Aprecio — Para Personas Queridas</title>
  <meta name="description" content="Página interactiva: una flor que crece y un mensaje de aprecio que se adapta (amigas, hermanas, mamá)." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #fffbf5;
      --accent: #f7c948;
      --accent-2: #ffb84d;
      --ink: #2b2b2b;
      --card: rgba(255,255,255,0.95);
      --muted: #6b5e4a;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#fffaf0,#fff6e6);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .panel{width:100%;max-width:980px;background:var(--card);border-radius:16px;box-shadow:0 18px 60px rgba(30,20,10,0.12);overflow:hidden;display:grid;grid-template-columns:1fr 420px;gap:0}
    @media (max-width:920px){.panel{grid-template-columns:1fr;max-width:720px}}
    /* left: scene */
    .scene{position:relative;padding:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:520px}
    .title{font-family:Playfair Display,serif;font-size:2rem;color:var(--muted);margin:0;text-align:center}
    .subtitle{margin:0;color:#7a6b55;font-size:0.95rem;text-align:center}
    /* flower container */
    .flower-stage{width:340px;height:340px;display:grid;place-items:center;position:relative;touch-action:none}
    svg.flower{width:100%;height:100%;overflow:visible}
    /* controls */
    .controls{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
    select,button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid rgba(40,30,20,0.06);background:white;cursor:pointer}
    .grow-btn{background:linear-gradient(180deg,var(--accent),var(--accent-2));border:0;color:#2b1600;font-weight:700;box-shadow:0 10px 30px rgba(247,201,72,0.14)}
    .reset{background:transparent;border:1px solid rgba(40,30,20,0.06)}
    /* right: message card */
    .card{padding:28px;background:linear-gradient(180deg,#fff,#fffef6);display:flex;flex-direction:column;gap:12px;align-items:stretch}
    .label{font-size:0.8rem;color:#8b6f3b;letter-spacing:.12em;text-transform:uppercase}
    .preview{min-height:220px;border-radius:12px;padding:18px;background:linear-gradient(180deg, rgba(255,250,240,0.9), rgba(255,250,240,0.98));box-shadow:inset 0 1px 0 rgba(255,255,255,.6);font-size:1rem;color:var(--muted);line-height:1.5}
    .signature{margin-top:6px;color:#7a5a2a;font-weight:600}
    .actions{display:flex;gap:10px;align-items:center;margin-top:auto}
    .copy{background:#fff;border:1px solid rgba(40,30,20,0.06);padding:10px 12px;border-radius:10px}
    .share{background:linear-gradient(180deg,#f7c948,#ffb84d);border:0;color:#2b1600;padding:10px 12px;border-radius:10px;font-weight:700}
    .tone{font-size:0.9rem;color:#9b8b70}
    /* animation helpers */
    .petal{fill:#ffd86a;filter:drop-shadow(0 6px 12px rgba(180,120,20,0.12))}
    .stem{fill:#3d8b45}
    .core{fill:#8c5b20}
    /* reduced motion */
    @media (prefers-reduced-motion: reduce){
      .flower-stage *, .petal { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel" role="application" aria-label="Jardín de aprecio interactivo">
      <section class="scene" aria-hidden="false">
        <h2 class="title">Jardín de Aprecio</h2>
        <p class="subtitle">Una flor que crece para celebrar a quienes te importan — personalízala y compártela.</p>

        <div class="flower-stage" id="stage" aria-live="polite">
          <!-- SVG flower: petals grouped for animation -->
          <svg class="flower" viewBox="0 0 200 200" role="img" aria-labelledby="flowerTitle flowerDesc">
            <title id="flowerTitle">Flor de aprecio</title>
            <desc id="flowerDesc">Una flor amarilla que crece desde pequeña hasta llena.</desc>
            <g id="flower-root" transform="translate(100,100) scale(0.22)" >
              <g id="petals" transform="rotate(0)">
                <!-- 12 petals -->
                <g class="petal-group">
                  <!-- petals are individual paths for subtle stagger -->
                  <path class="petal" d="M0,-36 C10,-46 34,-44 36,-28 C38,-12 18,-6 0,6 C-18,-6 -38,-12 -36,-28 C-34,-44 -10,-46 0,-36" />
                </g>
                <!-- We'll clone petals in JS to create radial layout -->
              </g>
              <circle class="core" cx="0" cy="0" r="14" />
              <rect class="stem" x="-4" y="34" width="8" height="64" rx="4" />
            </g>
          </svg>
        </div>

        <div class="controls" role="region" aria-label="Controles">
          <label for="audience" class="tone" style="display:none">Audiencia</label>
          <select id="audience" title="Selecciona a quién va dirigido">
            <option value="amigas">Amigas</option>
            <option value="hermanas">Hermanas</option>
            <option value="madre">Mamá</option>
            <option value="familia">Familia</option>
          </select>
          <button class="grow-btn" id="grow">Hacer crecer</button>
          <button class="reset" id="reset">Reiniciar</button>
        </div>
      </section>

      <aside class="card" aria-label="Mensaje de apreciación">
        <div>
          <div class="label">Mensaje adaptable</div>
          <div class="tone" style="margin-top:6px">Selecciona la audiencia; el mensaje es claro y no romántico.</div>
        </div>

        <div class="preview" id="preview" tabindex="0" aria-live="polite">
        </div>
        <div class="signature" id="signature">— Un gesto de cariño</div>

        <div class="actions" role="group" aria-label="Acciones">
          <button class="copy" id="copyBtn" title="Copiar texto">Copiar texto</button>
          <button class="share" id="shareBtn">Compartir enlace</button>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // Mensajes neutrales, diseñados para no sonar románticos
    const MESSAGES = {
      amigas: {
        title: "Para mis amigas",
        body: "Gracias por la risa, los planes y por estar cuando más se necesita. Aprecio cada momento que compartimos y celebro la fuerza y la lealtad que traéis a mi vida."
      },
      hermanas: {
        title: "Para mi hermana",
        body: "Gracias por ser compañera, cómplice y amiga. Tu apoyo y tu manera de estar lo cambia todo. Hoy te celebro y te agradezco."
      },
      madre: {
        title: "Para mi mamá",
        body: "Gracias por tu amor, tus enseñanzas y tu compañía. Tu entrega hace que todo sea más fácil; esto es un pequeño gesto para decir: gracias y te quiero."
      },
      familia: {
        title: "Para mi familia",
        body: "Gracias por ser mi refugio y mi equipo. Valoro cada gesto, recuerdo y conversación que compartimos. Esto es para celebrar lo que somos juntos."
      }
    };

    const stage = document.getElementById('stage');
    const flowerRoot = document.getElementById('flower-root');
    const petalsGroup = document.getElementById('petals');
    const audience = document.getElementById('audience');
    const preview = document.getElementById('preview');
    const signature = document.getElementById('signature');
    const growBtn = document.getElementById('grow');
    const resetBtn = document.getElementById('reset');
    const copyBtn = document.getElementById('copyBtn');
    const shareBtn = document.getElementById('shareBtn');

    // Create radial petals by cloning the single path
    (function createPetalRing(){
      const original = petalsGroup.querySelector('.petal-group');
      petalsGroup.innerHTML = '';
      const count = 12;
      for(let i=0;i<count;i++){
        const g = original.cloneNode(true);
        g.style.transform = `rotate(${i*(360/count)}deg)`;
        // stagger via CSS variable
        g.style.transition = 'transform 900ms cubic-bezier(.2,.9,.2,1), opacity 700ms';
        g.style.opacity = '0.0';
        petalsGroup.appendChild(g);
      }
    })();

    // initial state
    let state = { scale: 0.22, bloomed: false };
    function renderPreview() {
      const key = audience.value;
      const msg = MESSAGES[key];
      preview.innerHTML = `<strong style="display:block;margin-bottom:8px;font-weight:700;color:#3b2b12">${msg.title}</strong><div>${msg.body}</div>`;
      signature.textContent = "— Un abrazo";
    }
    renderPreview();

    // animate growth: scale flower group and reveal petals
    function growFlower() {
      if(state.bloomed) return;
      state.bloomed = true;
      // scale root from small to 1
      const root = flowerRoot;
      root.style.transition = 'transform 1200ms cubic-bezier(.16,1,.3,1)';
      root.style.transform = 'translate(100,100) scale(1)';
      // reveal petals with slight stagger
      const groups = petalsGroup.querySelectorAll('.petal-group');
      groups.forEach((g, i) => {
        setTimeout(() => {
          g.style.opacity = '1';
          g.style.transform = g.style.transform + ' translateZ(0) scale(1.04)';
        }, 70 * i);
      });
      // pulse core
      const core = flowerRoot.querySelector('.core');
      core.animate([{ transform: 'scale(.9)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1)' }], { duration: 900, easing: 'cubic-bezier(.2,1,.3,1)' });
      // subtle stem rise
      const stem = flowerRoot.querySelector('.stem');
      stem.animate([{ transform: 'translateY(20px)' }, { transform: 'translateY(0)' }], { duration: 1000, easing: 'ease-out' });
      // when opened, adapt message tone a bit
      setTimeout(()=> {
        const key = audience.value;
        if(key === 'madre') signature.textContent = '— Con todo mi cariño';
        else signature.textContent = '— Con cariño';
      }, 700);
    }

    function resetFlower() {
      state.bloomed = false;
      flowerRoot.style.transition = 'transform 500ms ease';
      flowerRoot.style.transform = 'translate(100,100) scale(0.22)';
      const groups = petalsGroup.querySelectorAll('.petal-group');
      groups.forEach(g => { g.style.opacity = '0'; g.style.transform = g.style.transform.replace(' scale(1.04)',''); });
      signature.textContent = '— Un gesto de cariño';
    }

    growBtn.addEventListener('click', ()=> {
      // make sure preview updated
      renderPreview();
      growFlower();
    });
    resetBtn.addEventListener('click', ()=> {
      resetFlower();
    });
    audience.addEventListener('change', () => {
      renderPreview();
      // if already bloomed, slightly change signature for clarity
      if(state.bloomed) {
        const key = audience.value;
        if(key === 'madre') signature.textContent = '— Con todo mi cariño';
        else signature.textContent = '— Con cariño';
      }
    });

    // copy message text
    copyBtn.addEventListener('click', async () => {
      const key = audience.value;
      const msg = MESSAGES[key];
      const text = `${msg.title}\n\n${msg.body}\n\n${signature.textContent}`;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copiado ✓';
        setTimeout(()=> copyBtn.textContent = 'Copiar texto', 1800);
      } catch(e) {
        copyBtn.textContent = 'Copiar (falló)';
        setTimeout(()=> copyBtn.textContent = 'Copiar texto', 1800);
      }
    });

    // share: opens native share if available, else copies URL with params
    shareBtn.addEventListener('click', async () => {
      const params = new URLSearchParams({ to: audience.value });
      const shareUrl = location.origin + location.pathname + '?' + params.toString();
      const key = audience.value;
      const msg = `${MESSAGES[key].title} — ${MESSAGES[key].body}`;
      if(navigator.share) {
        try {
          await navigator.share({ title: 'Un detalle para ti', text: MESSAGES[key].body, url: shareUrl });
        } catch(e) {
          // user cancelled
        }
      } else {
        try {
          await navigator.clipboard.writeText(shareUrl);
          shareBtn.textContent = 'Enlace copiado ✓';
          setTimeout(()=> shareBtn.textContent = 'Compartir enlace', 2000);
        } catch(e) {
          window.open(shareUrl, '_blank', 'noopener');
        }
      }
    });

    // support ?to=audience preselect from URL
    (function preselectFromUrl(){
      const url = new URL(location.href);
      const to = url.searchParams.get('to');
      if(to && MESSAGES[to]) {
        audience.value = to;
        renderPreview();
      }
    })();

    // accessibility: keyboard to grow (Enter on stage)
    stage.addEventListener('keydown', (e)=> {
      if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); growFlower(); }
    });

    // initialize small scale explicitly
    resetFlower();
  </script>
</body>
</html>
